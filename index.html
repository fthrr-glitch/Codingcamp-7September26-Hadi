<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <style>
/* ============================================================
   PERSONAL DASHBOARD — style.css
   Challenges: Light/Dark Mode · Custom Name · Prevent Duplicates
   ============================================================ */

/* ---------- CSS Variables ---------- */
:root {
  --clr-bg:          #f0f4f8;
  --clr-surface:     #ffffff;
  --clr-surface-alt: #e8edf2;
  --clr-border:      #d1d9e0;
  --clr-text:        #1a202c;
  --clr-text-muted:  #718096;
  --clr-primary:     #4f6ef7;
  --clr-primary-h:   #3a57d4;
  --clr-secondary:   #e2e8f0;
  --clr-secondary-h: #cbd5e0;
  --clr-danger:      #e53e3e;
  --clr-success:     #38a169;
  --clr-warning:     #dd6b20;
  --clr-done-text:   #a0aec0;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow:    0 4px 12px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.14);

  --transition: .2s ease;

  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

[data-theme="dark"] {
  --clr-bg:          #0f1117;
  --clr-surface:     #1a1d27;
  --clr-surface-alt: #252836;
  --clr-border:      #2d3148;
  --clr-text:        #e2e8f0;
  --clr-text-muted:  #718096;
  --clr-primary:     #6c8dff;
  --clr-primary-h:   #5a79f5;
  --clr-secondary:   #252836;
  --clr-secondary-h: #2d3148;
  --clr-done-text:   #4a5568;
}

/* ---------- Reset & Base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--clr-bg);
  color: var(--clr-text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  line-height: 1.6;
}

/* ---------- Typography ---------- */
h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 600; }
p  { font-size: .95rem; }

/* ---------- Header ---------- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1.5rem 2rem 1rem;
  max-width: 1100px;
  margin: 0 auto;
}

.header__left { display: flex; flex-direction: column; gap: .2rem; }

.datetime {
  font-size: .85rem;
  color: var(--clr-text-muted);
  letter-spacing: .02em;
}

.greeting { color: var(--clr-text); }

/* ---------- Main Grid ---------- */
.main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.5rem;
  padding: 0 2rem 2rem;
  max-width: 1100px;
  margin: 0 auto;
}

/* ---------- Card ---------- */
.card {
  background: var(--clr-surface);
  border: 1px solid var(--clr-border);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 1rem;
  transition: background var(--transition), border-color var(--transition);
}

.card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}

.card__title { color: var(--clr-text); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  padding: .5rem 1.1rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: .9rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  white-space: nowrap;
  text-decoration: none;
}

.btn:active { transform: scale(.97); }

.btn--primary {
  background: var(--clr-primary);
  color: #fff;
}
.btn--primary:hover { background: var(--clr-primary-h); box-shadow: var(--shadow-sm); }

.btn--secondary {
  background: var(--clr-secondary);
  color: var(--clr-text);
}
.btn--secondary:hover { background: var(--clr-secondary-h); }

.btn--ghost {
  background: transparent;
  color: var(--clr-text-muted);
  border: 1px solid var(--clr-border);
}
.btn--ghost:hover { background: var(--clr-surface-alt); color: var(--clr-text); }

.btn--danger {
  background: transparent;
  color: var(--clr-danger);
  border: none;
  padding: .3rem .5rem;
}
.btn--danger:hover { background: #fff0f0; }

[data-theme="dark"] .btn--danger:hover { background: #3b1a1a; }

.btn--icon {
  background: transparent;
  border: 1px solid var(--clr-border);
  border-radius: var(--radius-sm);
  padding: .45rem .65rem;
  font-size: 1.1rem;
  color: var(--clr-text);
  line-height: 1;
}
.btn--icon:hover { background: var(--clr-surface-alt); }

.btn--sm { padding: .35rem .8rem; font-size: .82rem; }
.btn--full { width: 100%; margin-top: .5rem; }

/* ---------- Inputs ---------- */
.input {
  width: 100%;
  padding: .55rem .85rem;
  border: 1px solid var(--clr-border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: .9rem;
  background: var(--clr-bg);
  color: var(--clr-text);
  transition: border-color var(--transition), background var(--transition);
  outline: none;
}

.input:focus { border-color: var(--clr-primary); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
.input::placeholder { color: var(--clr-text-muted); }
.input--sm { width: 80px; }

.select {
  padding: .4rem .7rem;
  border: 1px solid var(--clr-border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: .82rem;
  background: var(--clr-bg);
  color: var(--clr-text);
  cursor: pointer;
  outline: none;
  transition: border-color var(--transition), background var(--transition);
}
.select:focus { border-color: var(--clr-primary); }

.label {
  font-size: .82rem;
  color: var(--clr-text-muted);
  white-space: nowrap;
}

/* ---------- Error message ---------- */
.error-msg {
  font-size: .82rem;
  color: var(--clr-danger);
  padding: .35rem .7rem;
  background: #fff5f5;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--clr-danger);
}
[data-theme="dark"] .error-msg { background: #2d1515; }

/* ---------- Timer ---------- */
.timer__display {
  text-align: center;
  padding: 1.5rem 0 .5rem;
}

.timer__display span {
  font-size: clamp(3rem, 8vw, 5rem);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .04em;
  color: var(--clr-primary);
  display: block;
  line-height: 1;
}

.timer__controls {
  display: flex;
  gap: .6rem;
  justify-content: center;
  flex-wrap: wrap;
}

.timer-edit {
  display: flex;
  align-items: center;
  gap: .6rem;
  flex-wrap: wrap;
  padding: .75rem;
  background: var(--clr-surface-alt);
  border-radius: var(--radius-sm);
}

/* ---------- To-Do ---------- */
.todo__input-row {
  display: flex;
  gap: .6rem;
}

.todo__list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  max-height: 360px;
  overflow-y: auto;
  padding-right: .2rem;
}

.todo__list::-webkit-scrollbar { width: 4px; }
.todo__list::-webkit-scrollbar-track { background: transparent; }
.todo__list::-webkit-scrollbar-thumb { background: var(--clr-border); border-radius: 4px; }

.todo-item {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .6rem .75rem;
  background: var(--clr-surface-alt);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: background var(--transition), opacity var(--transition);
}

.todo-item:hover { border-color: var(--clr-border); }

.todo-item__check {
  width: 18px;
  height: 18px;
  accent-color: var(--clr-primary);
  flex-shrink: 0;
  cursor: pointer;
}

.todo-item__text {
  flex: 1;
  font-size: .9rem;
  word-break: break-word;
  color: var(--clr-text);
  transition: color var(--transition);
}

.todo-item--done .todo-item__text {
  text-decoration: line-through;
  color: var(--clr-done-text);
}

.todo-item__edit {
  flex: 1;
  font-size: .9rem;
  padding: .2rem .5rem;
  border: 1px solid var(--clr-primary);
  border-radius: var(--radius-sm);
  background: var(--clr-bg);
  color: var(--clr-text);
  font-family: inherit;
  outline: none;
}

.todo-item__actions {
  display: flex;
  gap: .2rem;
  flex-shrink: 0;
}

.todo-item__actions .btn {
  padding: .25rem .45rem;
  font-size: .78rem;
}

/* ---------- Quick Links ---------- */
.links__input-row {
  display: flex;
  gap: .6rem;
  flex-wrap: wrap;
}

.links__grid {
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
}

.link-item {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .4rem .9rem;
  background: var(--clr-surface-alt);
  border: 1px solid var(--clr-border);
  border-radius: 999px;
  font-size: .85rem;
  color: var(--clr-text);
  text-decoration: none;
  transition: background var(--transition), border-color var(--transition), transform var(--transition);
}

.link-item:hover {
  background: var(--clr-primary);
  color: #fff;
  border-color: var(--clr-primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.link-remove {
  background: transparent;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: .75rem;
  padding: 0 0 0 .2rem;
  opacity: .6;
  line-height: 1;
}
.link-remove:hover { opacity: 1; }

/* ---------- Modal ---------- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
  backdrop-filter: blur(4px);
}

.modal__card {
  background: var(--clr-surface);
  border-radius: var(--radius-lg);
  padding: 2rem;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: .75rem;
}

.modal__title   { font-size: 1.3rem; }
.modal__subtitle { font-size: .88rem; color: var(--clr-text-muted); margin-top: -.25rem; }

/* ---------- Footer ---------- */
.footer {
  text-align: center;
  padding: 1rem 2rem 1.5rem;
  font-size: .8rem;
  color: var(--clr-text-muted);
}

/* ---------- Utilities ---------- */
.hidden { display: none !important; }

/* ---------- Responsive ---------- */
@media (max-width: 600px) {
  .header { padding: 1.2rem 1rem .75rem; flex-wrap: wrap; }
  .main   { padding: 0 1rem 1.5rem; gap: 1rem; }

  .todo__input-row  { flex-wrap: wrap; }
  .links__input-row { flex-direction: column; }

  .timer__display span { font-size: 3.5rem; }
}

/* ---------- Scrollbar (global, thin) ---------- */
::-webkit-scrollbar       { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--clr-border); border-radius: 6px; }

  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header__left">
      <p id="datetime" class="datetime"></p>
      <h1 id="greeting" class="greeting"></h1>
    </div>
    <div class="header__right">
      <button id="themeToggle" class="btn btn--icon" aria-label="Toggle theme" title="Toggle Light / Dark mode">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- ========== NAME MODAL ========== -->
  <div id="nameModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__card">
      <h2 id="modalTitle" class="modal__title">What's your name?</h2>
      <p class="modal__subtitle">I'll use it to personalise your greeting.</p>
      <input
        id="nameInput"
        class="input"
        type="text"
        maxlength="30"
        placeholder="Enter your name…"
        autocomplete="off"
      />
      <button id="nameSaveBtn" class="btn btn--primary btn--full">Save</button>
    </div>
  </div>

  <!-- ========== MAIN ========== -->
  <main class="main">

    <!-- Focus Timer -->
    <section class="card" aria-labelledby="timerHeading">
      <div class="card__header">
        <h2 id="timerHeading" class="card__title">⏱ Focus Timer</h2>
        <button id="editTimerBtn" class="btn btn--ghost btn--sm" title="Change duration">Edit</button>
      </div>

      <!-- Custom duration input (hidden by default) -->
      <div id="timerEditPanel" class="timer-edit hidden">
        <label for="customMinutes" class="label">Minutes</label>
        <input id="customMinutes" class="input input--sm" type="number" min="1" max="120" value="25" />
        <button id="applyTimerBtn" class="btn btn--primary btn--sm">Apply</button>
      </div>

      <div class="timer__display" aria-live="polite">
        <span id="timerDisplay">25:00</span>
      </div>
      <div class="timer__controls">
        <button id="timerStart" class="btn btn--primary">Start</button>
        <button id="timerStop"  class="btn btn--secondary">Stop</button>
        <button id="timerReset" class="btn btn--ghost">Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card" aria-labelledby="todoHeading">
      <div class="card__header">
        <h2 id="todoHeading" class="card__title">✅ To-Do List</h2>
        <select id="sortSelect" class="select" title="Sort tasks">
          <option value="default">Sort: Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <div class="todo__input-row">
        <input
          id="todoInput"
          class="input"
          type="text"
          maxlength="100"
          placeholder="Add a new task…"
          autocomplete="off"
        />
        <button id="todoAddBtn" class="btn btn--primary">Add</button>
      </div>
      <p id="todoError" class="error-msg hidden" role="alert"></p>

      <ul id="todoList" class="todo__list" aria-label="Task list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="card" aria-labelledby="linksHeading">
      <div class="card__header">
        <h2 id="linksHeading" class="card__title">🔗 Quick Links</h2>
      </div>

      <div class="links__input-row">
        <input
          id="linkLabel"
          class="input"
          type="text"
          maxlength="30"
          placeholder="Label (e.g. YouTube)"
          autocomplete="off"
        />
        <input
          id="linkUrl"
          class="input"
          type="url"
          maxlength="200"
          placeholder="URL (https://…)"
          autocomplete="off"
        />
        <button id="linkAddBtn" class="btn btn--primary">Add</button>
      </div>
      <p id="linkError" class="error-msg hidden" role="alert"></p>

      <div id="linksList" class="links__grid" aria-label="Quick links"></div>
    </section>

  </main>

  <footer class="footer">
    <p>Built with ❤️ · <span id="footerName"></span></p>
  </footer>

  <script>
/* ============================================================
   PERSONAL DASHBOARD — app.js
   Features  : Greeting · Focus Timer · To-Do List · Quick Links
   Challenges : Light/Dark Mode · Custom Name · Prevent Duplicates
   Storage    : localStorage only (no backend)
   ============================================================ */

'use strict';

/* ──────────────────────────────────────────
   1. CONSTANTS & DOM REFERENCES
────────────────────────────────────────── */
const LS = {
  THEME:    'dashboard_theme',
  NAME:     'dashboard_name',
  TODOS:    'dashboard_todos',
  LINKS:    'dashboard_links',
  DURATION: 'dashboard_timer_duration',
};

const $ = (id) => document.getElementById(id);

const DOM = {
  html:          document.documentElement,
  datetime:      $('datetime'),
  greeting:      $('greeting'),
  footerName:    $('footerName'),
  themeToggle:   $('themeToggle'),
  themeIcon:     $('themeIcon'),

  // Name modal
  nameModal:     $('nameModal'),
  nameInput:     $('nameInput'),
  nameSaveBtn:   $('nameSaveBtn'),

  // Timer
  timerDisplay:  $('timerDisplay'),
  timerStart:    $('timerStart'),
  timerStop:     $('timerStop'),
  timerReset:    $('timerReset'),
  editTimerBtn:  $('editTimerBtn'),
  timerEditPanel:$('timerEditPanel'),
  customMinutes: $('customMinutes'),
  applyTimerBtn: $('applyTimerBtn'),

  // Todo
  todoInput:     $('todoInput'),
  todoAddBtn:    $('todoAddBtn'),
  todoList:      $('todoList'),
  todoError:     $('todoError'),
  sortSelect:    $('sortSelect'),

  // Links
  linkLabel:     $('linkLabel'),
  linkUrl:       $('linkUrl'),
  linkAddBtn:    $('linkAddBtn'),
  linksList:     $('linksList'),
  linkError:     $('linkError'),
};

/* ──────────────────────────────────────────
   2. THEME  (Challenge: Light / Dark Mode)
────────────────────────────────────────── */
const Theme = (() => {
  const ICONS = { light: '🌙', dark: '☀️' };

  function apply(theme) {
    DOM.html.setAttribute('data-theme', theme);
    DOM.themeIcon.textContent = ICONS[theme];
    localStorage.setItem(LS.THEME, theme);
  }

  function toggle() {
    const current = DOM.html.getAttribute('data-theme');
    apply(current === 'dark' ? 'light' : 'dark');
  }

  function init() {
    const saved = localStorage.getItem(LS.THEME) || 'light';
    apply(saved);
    DOM.themeToggle.addEventListener('click', toggle);
  }

  return { init };
})();

/* ──────────────────────────────────────────
   3. GREETING & CLOCK
   (Challenge: Custom Name in Greeting)
────────────────────────────────────────── */
const Greeting = (() => {
  let _name = '';

  const PERIODS = [
    { range: [5,  11],  msg: 'Good morning'   },
    { range: [12, 16],  msg: 'Good afternoon' },
    { range: [17, 20],  msg: 'Good evening'   },
    { range: [21, 23],  msg: 'Good night'     },
    { range: [0,  4],   msg: 'Good night'     },
  ];

  function getGreetingText(hour) {
    for (const p of PERIODS) {
      const [lo, hi] = p.range;
      if (hour >= lo && hour <= hi) return p.msg;
    }
    return 'Hello';
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now  = new Date();
    const hour = now.getHours();

    // Clock & date line
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const h   = pad(hour % 12 || 12);
    const min = pad(now.getMinutes());
    const sec = pad(now.getSeconds());
    const ampm = hour < 12 ? 'AM' : 'PM';
    const day  = days[now.getDay()];
    const date = now.getDate();
    const mon  = months[now.getMonth()];
    const year = now.getFullYear();

    DOM.datetime.textContent = `${day}, ${mon} ${date} ${year}  ·  ${h}:${min}:${sec} ${ampm}`;

    // Greeting
    const base = getGreetingText(hour);
    DOM.greeting.textContent = _name ? `${base}, ${_name} 👋` : `${base} 👋`;
  }

  function setName(name) {
    _name = name.trim();
    localStorage.setItem(LS.NAME, _name);
    DOM.footerName.textContent = _name ? `Hi ${_name}!` : '';
    tick();
  }

  function init() {
    _name = localStorage.getItem(LS.NAME) || '';

    // Show name modal if no saved name
    if (!_name) {
      DOM.nameModal.classList.remove('hidden');
    }

    // Save name on button click
    DOM.nameSaveBtn.addEventListener('click', () => {
      const val = DOM.nameInput.value.trim();
      if (!val) { DOM.nameInput.focus(); return; }
      setName(val);
      DOM.nameModal.classList.add('hidden');
    });

    // Also save on Enter key
    DOM.nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') DOM.nameSaveBtn.click();
    });

    DOM.footerName.textContent = _name ? `Hi ${_name}!` : '';
    tick();
    setInterval(tick, 1000);
  }

  return { init };
})();

/* ──────────────────────────────────────────
   4. FOCUS TIMER
   (Challenge: Change Pomodoro Time)
────────────────────────────────────────── */
const Timer = (() => {
  const DEFAULT_MINUTES = 25;

  let totalSeconds = 0;
  let remaining    = 0;
  let intervalId   = null;
  let running      = false;

  function formatTime(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function render() {
    DOM.timerDisplay.textContent = formatTime(remaining);
  }

  function setDuration(minutes) {
    stop();
    totalSeconds = minutes * 60;
    remaining    = totalSeconds;
    localStorage.setItem(LS.DURATION, minutes);
    DOM.customMinutes.value = minutes;
    render();
  }

  function start() {
    if (running) return;
    if (remaining === 0) remaining = totalSeconds;
    running = true;

    intervalId = setInterval(() => {
      if (remaining <= 0) {
        stop();
        DOM.timerDisplay.textContent = '00:00';
        return;
      }
      remaining--;
      render();
    }, 1000);
  }

  function stop() {
    clearInterval(intervalId);
    intervalId = null;
    running    = false;
  }

  function reset() {
    stop();
    remaining = totalSeconds;
    render();
  }

  function init() {
    const saved   = parseInt(localStorage.getItem(LS.DURATION), 10);
    const minutes = (saved && saved > 0) ? saved : DEFAULT_MINUTES;
    setDuration(minutes);

    DOM.timerStart.addEventListener('click', start);
    DOM.timerStop.addEventListener('click',  stop);
    DOM.timerReset.addEventListener('click', reset);

    // Edit panel toggle
    DOM.editTimerBtn.addEventListener('click', () => {
      DOM.timerEditPanel.classList.toggle('hidden');
    });

    DOM.applyTimerBtn.addEventListener('click', () => {
      const val = parseInt(DOM.customMinutes.value, 10);
      if (!val || val < 1 || val > 120) {
        DOM.customMinutes.focus();
        return;
      }
      setDuration(val);
      DOM.timerEditPanel.classList.add('hidden');
    });

    DOM.customMinutes.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') DOM.applyTimerBtn.click();
    });
  }

  return { init };
})();

/* ──────────────────────────────────────────
   5. TO-DO LIST
   (Challenge: Prevent Duplicate Tasks)
   (Challenge: Sort Tasks — bonus included)
────────────────────────────────────────── */
const Todos = (() => {
  let tasks = [];

  /* ---- Persistence ---- */
  function load() {
    try { tasks = JSON.parse(localStorage.getItem(LS.TODOS)) || []; }
    catch { tasks = []; }
  }

  function save() { localStorage.setItem(LS.TODOS, JSON.stringify(tasks)); }

  /* ---- Helpers ---- */
  function generateId() { return `t_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }

  function normalize(str) { return str.trim().toLowerCase(); }

  function isDuplicate(text) {
    return tasks.some(t => normalize(t.text) === normalize(text));
  }

  function showError(msg) {
    DOM.todoError.textContent = msg;
    DOM.todoError.classList.remove('hidden');
    clearTimeout(DOM.todoError._timer);
    DOM.todoError._timer = setTimeout(() => DOM.todoError.classList.add('hidden'), 3000);
  }

  /* ---- Sort ---- */
  function getSorted() {
    const mode = DOM.sortSelect.value;
    const copy = [...tasks];
    if (mode === 'az')   return copy.sort((a,b) => a.text.localeCompare(b.text));
    if (mode === 'za')   return copy.sort((a,b) => b.text.localeCompare(a.text));
    if (mode === 'done') return copy.sort((a,b) => Number(a.done) - Number(b.done));
    return copy; // default: insertion order
  }

  /* ---- Render ---- */
  function render() {
    DOM.todoList.innerHTML = '';
    const sorted = getSorted();

    if (!sorted.length) {
      const empty = document.createElement('li');
      empty.textContent = 'No tasks yet. Add one above!';
      empty.style.cssText = 'color:var(--clr-text-muted);font-size:.88rem;padding:.5rem .25rem;';
      DOM.todoList.appendChild(empty);
      return;
    }

    sorted.forEach((task) => {
      const li = document.createElement('li');
      li.className = `todo-item${task.done ? ' todo-item--done' : ''}`;
      li.dataset.id = task.id;

      // Checkbox
      const cb = document.createElement('input');
      cb.type    = 'checkbox';
      cb.checked = task.done;
      cb.className = 'todo-item__check';
      cb.setAttribute('aria-label', `Mark "${task.text}" as ${task.done ? 'undone' : 'done'}`);
      cb.addEventListener('change', () => toggleDone(task.id));

      // Text span
      const span = document.createElement('span');
      span.className   = 'todo-item__text';
      span.textContent = task.text;

      // Actions
      const actions = document.createElement('div');
      actions.className = 'todo-item__actions';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn--ghost btn--sm';
      editBtn.textContent = '✏️';
      editBtn.setAttribute('aria-label', `Edit "${task.text}"`);
      editBtn.addEventListener('click', () => startEdit(task.id, li, span));

      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn--danger btn--sm';
      delBtn.textContent = '🗑';
      delBtn.setAttribute('aria-label', `Delete "${task.text}"`);
      delBtn.addEventListener('click', () => deleteTask(task.id));

      actions.append(editBtn, delBtn);
      li.append(cb, span, actions);
      DOM.todoList.appendChild(li);
    });
  }

  /* ---- CRUD ---- */
  function addTask(text) {
    text = text.trim();
    if (!text) return;

    // Challenge: Prevent duplicates
    if (isDuplicate(text)) {
      showError(`"${text}" is already in your list!`);
      return;
    }

    tasks.push({ id: generateId(), text, done: false });
    save();
    render();
    DOM.todoInput.value = '';
    DOM.todoInput.focus();
  }

  function toggleDone(id) {
    const task = tasks.find(t => t.id === id);
    if (task) { task.done = !task.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function startEdit(id, li, span) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    // Replace text span with input
    const input = document.createElement('input');
    input.type      = 'text';
    input.value     = task.text;
    input.className = 'todo-item__edit';
    input.maxLength = 100;
    li.replaceChild(input, span);
    input.focus();
    input.select();

    // Replace edit button with save button
    const saveBtn = li.querySelector('.btn--ghost');
    saveBtn.textContent = '💾';
    saveBtn.setAttribute('aria-label', 'Save edit');

    const commit = () => {
      const newText = input.value.trim();
      if (!newText) { input.focus(); return; }

      // Duplicate check (allow keeping same text)
      if (normalize(newText) !== normalize(task.text) && isDuplicate(newText)) {
        input.style.borderColor = 'var(--clr-danger)';
        input.title = 'Duplicate task!';
        input.focus();
        return;
      }

      task.text = newText;
      save();
      render();
    };

    saveBtn.replaceEventListener = true;
    saveBtn.onclick = commit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter')  commit();
      if (e.key === 'Escape') render(); // cancel
    });
    input.addEventListener('blur', () => {
      // Small delay so save-button click fires first
      setTimeout(commit, 150);
    });
  }

  /* ---- Init ---- */
  function init() {
    load();
    render();

    DOM.todoAddBtn.addEventListener('click', () => addTask(DOM.todoInput.value));
    DOM.todoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask(DOM.todoInput.value);
    });
    DOM.sortSelect.addEventListener('change', render);
  }

  return { init };
})();

/* ──────────────────────────────────────────
   6. QUICK LINKS
────────────────────────────────────────── */
const Links = (() => {
  let links = [];

  /* ---- Persistence ---- */
  function load() {
    try { links = JSON.parse(localStorage.getItem(LS.LINKS)) || []; }
    catch { links = []; }
  }

  function save() { localStorage.setItem(LS.LINKS, JSON.stringify(links)); }

  /* ---- Helpers ---- */
  function generateId() { return `l_${Date.now()}_${Math.random().toString(36).slice(2,7)}`; }

  function normalizeUrl(url) {
    url = url.trim();
    if (!url) return '';
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    return url;
  }

  function showError(msg) {
    DOM.linkError.textContent = msg;
    DOM.linkError.classList.remove('hidden');
    clearTimeout(DOM.linkError._timer);
    DOM.linkError._timer = setTimeout(() => DOM.linkError.classList.add('hidden'), 3000);
  }

  /* ---- Render ---- */
  function render() {
    DOM.linksList.innerHTML = '';

    if (!links.length) {
      const empty = document.createElement('p');
      empty.textContent = 'No quick links yet.';
      empty.style.cssText = 'color:var(--clr-text-muted);font-size:.88rem;';
      DOM.linksList.appendChild(empty);
      return;
    }

    links.forEach((link) => {
      const wrapper = document.createElement('div');
      wrapper.style.display = 'inline-flex';
      wrapper.style.alignItems = 'center';

      const a = document.createElement('a');
      a.href        = link.url;
      a.textContent = link.label;
      a.className   = 'link-item';
      a.target      = '_blank';
      a.rel         = 'noopener noreferrer';

      const removeBtn = document.createElement('button');
      removeBtn.className = 'link-remove';
      removeBtn.textContent = '✕';
      removeBtn.setAttribute('aria-label', `Remove ${link.label}`);
      removeBtn.addEventListener('click', () => removeLink(link.id));

      a.appendChild(removeBtn);
      wrapper.appendChild(a);
      DOM.linksList.appendChild(wrapper);
    });
  }

  /* ---- Add / Remove ---- */
  function addLink(label, url) {
    label = label.trim();
    url   = normalizeUrl(url);

    if (!label) { showError('Please enter a label.'); DOM.linkLabel.focus(); return; }
    if (!url)   { showError('Please enter a URL.');   DOM.linkUrl.focus();   return; }

    // Basic URL validation
    try { new URL(url); } catch {
      showError('That doesn\'t look like a valid URL.');
      DOM.linkUrl.focus();
      return;
    }

    links.push({ id: generateId(), label, url });
    save();
    render();
    DOM.linkLabel.value = '';
    DOM.linkUrl.value   = '';
    DOM.linkLabel.focus();
  }

  function removeLink(id) {
    links = links.filter(l => l.id !== id);
    save();
    render();
  }

  /* ---- Init ---- */
  function init() {
    load();
    render();

    DOM.linkAddBtn.addEventListener('click', () => {
      addLink(DOM.linkLabel.value, DOM.linkUrl.value);
    });

    [DOM.linkLabel, DOM.linkUrl].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addLink(DOM.linkLabel.value, DOM.linkUrl.value);
      });
    });
  }

  return { init };
})();

/* ──────────────────────────────────────────
   7. BOOTSTRAP
────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  Theme.init();
  Greeting.init();
  Timer.init();
  Todos.init();
  Links.init();
});

  </script>
